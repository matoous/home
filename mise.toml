# Install Fish plugins after tools are available.
[tasks.bootstrap]
run = ["fish -c 'fisher update'"]

[tasks."codex:setup"]
description = "Restore Codex plugins, including the public skill collection"
dir = "{{ vars.dotfiles_root }}"
run = "mise run codex:plugins"

[tasks."codex:config"]
description = "Apply plugin preferences while preserving private Codex configuration"
dir = "{{ vars.dotfiles_root }}"
run = '''
set -eu
umask 077
mkdir -p "$HOME/.codex"
if [ ! -e "$HOME/.codex/config.toml" ]; then
  install -m 600 dotfiles/codex/config.toml "$HOME/.codex/config.toml"
fi
mise --no-hooks dot apply '~/.codex/config.toml/plugins' '~/.codex/config.toml'
'''

[tasks."codex:plugins"]
description = "Restore missing Codex plugins and their enabled/disabled preferences"
dir = "{{ vars.dotfiles_root }}"
depends = ["codex:config"]
run = [
  '''
set -eu
marketplaces=$(codex plugin marketplace list --json)
if ! printf '%s\n' "$marketplaces" | jq -e '.marketplaces | any(.name == "son-of-anton")' >/dev/null; then
  codex plugin marketplace add https://github.com/matoous/son-of-anton.git
fi
''',
  "codex plugin marketplace add https://github.com/JetBrains/go-modern-guidelines.git",
  "codex plugin marketplace add https://github.com/incident-io/skills.git",
  '''
set -eu
selectors=$(taplo get -f dotfiles/codex/plugins.toml -o json plugins | jq -er 'keys[]')
installed=$(codex plugin list --json)
for plugin in $selectors; do
  if printf '%s\n' "$installed" | jq -e --arg plugin "$plugin" '.installed | any(.pluginId == $plugin)' >/dev/null; then
    continue
  fi
  case "$plugin" in
    *@openai-bundled|*@openai-primary-runtime)
      printf 'Provided by the Codex runtime when available: %s\n' "$plugin"
      ;;
    *) codex plugin add "$plugin" ;;
  esac
done
''',
  "mise run codex:config",
]

[dotfiles."~/.codex/config.toml"]
permissions = "0600"

[dotfile_groups.home]
root = "."
manifest = "git"
# The source tree is organized by app. Deploy only the mappings below.
exclude = ["**/*"]

[dotfile_groups.home.entries]
"~/.config/bat" = { source = "bat", mode = "symlink-each" }
"~/.codex" = { source = "codex", mode = "symlink-each", exclude = [
  "config.toml",
  "plugins.toml",
] }
"~/.codex/config.toml/plugins" = { source = "codex/plugins.toml", merge = true }
"~/.config/pgcli" = { source = "pgcli", mode = "symlink-each" }
"~/.config/fish" = { source = "fish", mode = "symlink-each" }
"~/.config/gh" = { source = "gh", mode = "symlink-each", exclude = [
  "hosts.yml",
] }
"~/.config/gh-dash" = { source = "gh-dash", mode = "symlink-each" }
"~/.config/git" = { source = "git", mode = "symlink-each" }
"~/.config/helix" = { source = "helix", mode = "symlink-each", exclude = [
  "runtime",
] }
"~/.config/mise" = { source = "mise", mode = "symlink-each" }
"~/.config/mitos" = { source = "mitos", mode = "symlink-each", exclude = [
  "runtime",
] }
"~/.config/neofetch" = { source = "neofetch", mode = "symlink-each" }
"~/.config/rex" = { source = "rex", mode = "symlink-each" }
"~/.config/rex/themes" = { source = "ghostty/themes", mode = "symlink-each" }
"~/.config/mddog/config.toml" = { source = "mddog/config.toml" }
