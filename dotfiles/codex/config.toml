# Portable Codex preferences. Keep credentials and project trust local.
"model" = "gpt-6.1-sol"
"model_reasoning_effort" = "high"
"check_for_update_on_startup" = false
"web_search" = "cached"
"project_root_markers" = [".git", ".hg", ".sl", ".helix"]
"approvals_reviewer" = "auto_review"
"service_tier" = "default"
"cli_auth_credentials_store" = "keyring"

["analytics"]
"enabled" = false

["features"]
"apps" = true
"multi_agent" = true
"runtime_metrics" = false
"shell_snapshot" = false
"shell_tool" = true
"memories" = true
"workspace_dependencies" = true
"prevent_idle_sleep" = true
"daemon_auto_start" = false

["feedback"]
"enabled" = false

["plugins"]

["plugins"."github@openai-curated"]
"enabled" = true

["plugins"."documents@openai-primary-runtime"]
"enabled" = true

["plugins"."pdf@openai-primary-runtime"]
"enabled" = true

["plugins"."spreadsheets@openai-primary-runtime"]
"enabled" = true

["plugins"."presentations@openai-primary-runtime"]
"enabled" = true

["plugins"."template-creator@openai-primary-runtime"]
"enabled" = true

["plugins"."visualize@openai-bundled"]
"enabled" = true

["plugins"."browser@openai-bundled"]
"enabled" = true

["plugins"."incident-io@incident-io-skills"]
enabled = true

["plugins"."codex-app-tools@openai-bundled"]
enabled = true

["plugins"."unified-computer-use@openai-bundled"]
enabled = false

["plugins"."computer-use@openai-bundled"]
enabled = false

["plugins"."code-review@openai-bundled"]
enabled = true

["plugins"."modern-go-guidelines@goland-codex-marketplace"]
enabled = true

["tui"]
"status_line" = ["context-remaining", "git-branch", "model-name", "used-tokens"]
"pet" = "disabled"
"screen_reader_detection_done" = true
"session_picker_view" = "dense"
"notifications" = ["agent-turn-complete", "approval-requested"]
"notification_method" = "auto"
"notification_condition" = "unfocused"

["tui".model_availability_nux]
"gpt-6.1-sol" = 4

["mcp_servers"]

["mcp_servers"."context7"]
url = "https://mcp.context7.com/mcp"

["mcp_servers"."gopls"]
command = "gopls"
args = ["mcp"]

["mcp_servers"."gopls".tools.go_diagnostics]
approval_mode = "approve"

["mcp_servers"."gopls".tools.go_file_context]
approval_mode = "approve"

["mcp_servers"."gopls".tools.go_search]
approval_mode = "approve"

["mcp_servers"."gopls".tools.go_symbol_references]
approval_mode = "approve"

["mcp_servers"."gopls".tools.go_vulncheck]
approval_mode = "approve"

["mcp_servers"."gopls".tools.go_workspace]
approval_mode = "approve"

["mcp_servers"."github"]
url = "https://api.githubcopilot.com/mcp/"
# Set http_headers.Authorization to "Bearer <token>" in the private local config.

["mcp_servers"."honeycomb"]
enabled = true
url = "https://mcp.eu1.honeycomb.io/mcp"

["mcp_servers"."honeycomb".tools.run_query]
approval_mode = "approve"

["mcp_servers"."cloudflare"]
enabled = true
url = "https://mcp.cloudflare.com/mcp"

["mcp_servers"."computer-use"]
command = "./Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient"
args = ["mcp"]
enabled = true

["mcp_servers"."notion"]
url = "https://mcp.notion.com/mcp"

["mcp_servers"."figma"]
enabled = true
url = "https://mcp.figma.com/mcp"

["mcp_servers"."openai_developer_docs"]
url = "https://developers.openai.com/mcp"

["mcp_servers".atlassian]
url = "https://mcp.atlassian.com/v2/mcp"

["desktop"]
"followUpQueueMode" = "queue"
"dock-icon-preference" = "app-default"
"mac-menu-bar-enabled" = true
"show-context-window-usage" = true
"avatar-overlay-mascot-width-px" = 80
"conversationDetailMode" = "STEPS_COMMANDS"
"git-pull-request-merge-method" = "squash"
"git-commit-instructions" = "Use conventional commit messages and concise descriptions. If addressing an issue describe the issue and the fix."
ambient-suggestions-enabled = false
avatar-overlay-pet-visible = false

["desktop"."open-in-target-preferences"]
"global" = "ghostty"

["desktop"."appearanceLightChromeTheme"]
"accent" = "#339cff"
"contrast" = 45
"ink" = "#1a1c1f"
"opaqueWindows" = false
"surface" = "#ffffff"

["desktop"."appearanceLightChromeTheme"."fonts"]
"code" = "Berkeley Mono"

["desktop"."appearanceLightChromeTheme"."semanticColors"]
"diffAdded" = "#00a240"
"diffRemoved" = "#ba2623"
"skill" = "#924ff7"

["desktop"."appearanceDarkChromeTheme"]
"accent" = "#339cff"
"contrast" = 60
"ink" = "#ffffff"
"opaqueWindows" = false
"surface" = "#181818"

["desktop"."appearanceDarkChromeTheme"."fonts"]
"code" = "Berkeley Mono"

["desktop"."appearanceDarkChromeTheme"."semanticColors"]
"diffAdded" = "#40c977"
"diffRemoved" = "#fa423e"
"skill" = "#ad7bf9"

[marketplaces.incident-io-skills]
source_type = "git"
source = "https://github.com/incident-io/skills.git"

[marketplaces.goland-codex-marketplace]
source_type = "git"
source = "https://github.com/JetBrains/go-modern-guidelines.git"

# Keep injected MCP credentials out of ordinary shell commands.
[shell_environment_policy]
ignore_default_excludes = false
